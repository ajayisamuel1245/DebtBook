{% extends 'ledger/master.html' %}

{% block title %}{{ title }} - Credit Ledger{% endblock %}

{% block content %}
<p style="font-size:19px;font-weight:600;margin-bottom:20px;">{{ title }}</p>

<div style="background:#ffffff;border:1px solid #e3e8e0;border-radius:10px;padding:24px;">
    {% if form.errors %}
        <ul style="color:#b3372c;font-size:13px;margin-bottom:16px;list-style:none;padding:0;">
            {% for field in form %}{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}{% endfor %}
        </ul>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:16px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Name</label>
            <input type="text" name="name" value="{{ form.name.value|default:'' }}" placeholder="e.g. John Adewale"
                   style="width:100%;padding:11px 12px;border:1px solid #dfe3dc;border-radius:8px;font-size:14px;">
        </div>
        <div style="margin-bottom:16px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Phone</label>
            <input type="text" name="phone" value="{{ form.phone.value|default:'' }}" placeholder="e.g. 0801 111 1111"
                   style="width:100%;padding:11px 12px;border:1px solid #dfe3dc;border-radius:8px;font-size:14px;">
        </div>
        <div style="margin-bottom:20px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Notes (optional)</label>
            <input type="text" name="notes" value="{{ form.notes.value|default:'' }}" placeholder="e.g. Usually pays late"
                   style="width:100%;padding:11px 12px;border:1px solid #dfe3dc;border-radius:8px;font-size:14px;">
        </div>
        <button type="submit" style="width:100%;padding:12px;background:#1f3d2e;color:#fdfcf8;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Save</button>
    </form>
</div>
{% endblock %}
