{% extends 'ledger/master.html' %}

{% block title %}{{ title }} - Credit Ledger{% endblock %}

{% block content %}
<p style="font-size:19px;font-weight:600;margin-bottom:20px;">{{ title }}</p>

<div style="background:#ffffff;border:1px solid #e3e8e0;border-radius:10px;padding:24px;">
    {% if form.errors %}
        <ul style="color:#b3372c;font-size:13px;margin-bottom:16px;list-style:none;padding:0;">
            {% for field in form %}{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}{% endfor %}
        </ul>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:16px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Customer</label>
            <select name="customer" style="width:100%;padding:11px 12px;border:1px solid #dfe3dc;border-radius:8px;font-size:14px;background:#fdfcf8;">
                {% for customer in form.fields.customer.queryset %}
                <option value="{{ customer.pk }}" {% if form.customer.value|stringformat:"s" == customer.pk|stringformat:"s" %}selected{% endif %}>{{ customer.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="margin-bottom:16px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Amount (₦)</label>
            <input type="number" step="0.01" name="amount" value="{{ form.amount.value|default:'' }}" placeholder="e.g. 5000"
                   style="width:100%;padding:11px 12px;border:1px solid #dfe3dc;border-radius:8px;font-size:14px;">
        </div>
        <div style="margin-bottom:16px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Description (optional)</label>
            <input type="text" name="description" value="{{ form.description.value|default:'' }}" placeholder="e.g. 2 bags of rice"
                   style="width:100%;padding:11px 12px;border:1px solid #dfe3dc;border-radius:8px;font-size:14px;">
        </div>
        <div style="margin-bottom:20px;">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;">Date</label>
            <input type="date" name="date" value="{{ form.date.value|date:'Y-m-d'|default:'' }}"
                   style="width:100%;padding:11px 12px;border:1px solid #dfe3dc;border-radius:8px;font-size:14px;">
        </div>
        <button type="submit" style="width:100%;padding:12px;background:{% if entry_type == 'credit' %}#b3372c{% else %}#3b6d11{% endif %};color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">
            Save {{ title }}
        </button>
    </form>
</div>
{% endblock %}
